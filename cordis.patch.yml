# ============================================================================
# dsh-meshmoe - DeepSeek Harness bundle patch
#
# This bundle contributes ONE row: the MeshMoe runtime manager. It does not
# redeclare llm-pi-ai or agent-default-model: patch rows replace an existing
# row's entire `config`, so re-inserting them would drop every provider the
# user already configured and could steal their default model.
#
# The meshmoe-local provider is added at runtime by lib/index.js, which reads
# the user's patch, folds the provider into the existing llm-pi-ai row and
# writes a merged patch. That keeps the user's providers and default model.
# ============================================================================
- insert:
    - id: meshmoe-runtime
      name: dsh-meshmoe
      config:
        llamaPort: 8081
        edgeNodePort: 4002
        autostartModel: true
        joinMesh: true
